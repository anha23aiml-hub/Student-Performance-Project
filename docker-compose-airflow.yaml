
services:
  airflow:
    image: apache/airflow:2.10.5
    container_name: student-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./:/opt/airflow/project
    restart: unless-stopped
